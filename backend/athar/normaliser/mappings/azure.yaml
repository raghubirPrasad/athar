# ATHAR provider mapping — Azure (SPEC §5.3). The ONLY place Azure RBAC actions and built-in
# roles are mapped to canonical (service_category, verb) pairs. Every entry is exercised by
# tests/unit/test_mappings_azure.py.
#
# Built-in role GUIDs are transcribed from the Azure built-in roles reference; SPEC §4.6 marks
# them (verify). A role is matched by GUID first, then by name (case-insensitive).
version: 1
cloud: azure

# Scope levels (SPEC §5.2): RG (and anything below it) → resource, subscription → project,
# management group → org, "/" → global.
scope_levels:
  - {pattern: '^/$', level: global}
  - {pattern: '^/providers/Microsoft\.Management/managementGroups/', level: org}
  - {pattern: '^/subscriptions/[^/]+/?$', level: project}
  - {pattern: '^/subscriptions/[^/]+/resourceGroups/', level: resource}
  - {pattern: '^/subscriptions/[^/]+/providers/', level: resource}

# Resource provider namespace → service_category (also used for activity-log-summary
# `resourceProvider`, SPEC §5.3).
services:
  Microsoft.Storage: storage
  Microsoft.DataLakeStore: storage
  Microsoft.RecoveryServices: storage
  Microsoft.Compute: compute
  Microsoft.Web: compute
  Microsoft.ContainerService: compute
  Microsoft.ContainerInstance: compute
  Microsoft.Resources: compute
  Microsoft.Batch: compute
  Microsoft.Network: network
  Microsoft.Cdn: network
  Microsoft.Authorization: identity
  Microsoft.ManagedIdentity: identity
  Microsoft.Management: identity
  Microsoft.AAD: identity
  microsoft.directory: identity
  Microsoft.Subscription: identity
  Microsoft.Sql: data
  Microsoft.DocumentDB: data
  Microsoft.DBforPostgreSQL: data
  Microsoft.DBforMySQL: data
  Microsoft.Synapse: data
  Microsoft.DataFactory: data
  Microsoft.EventHub: data
  Microsoft.ServiceBus: data
  Microsoft.Cache: data
  Microsoft.KeyVault: security
  Microsoft.Security: security
  Microsoft.Insights: security
  Microsoft.OperationalInsights: security
  Microsoft.PolicyInsights: security
  Microsoft.Support: security
  Microsoft.Billing: billing
  Microsoft.Consumption: billing
  Microsoft.CostManagement: billing
  Microsoft.Commerce: billing

# Last path segment of an action → verb (generic rule for unlisted actions of a known provider).
verb_suffixes:
  read: read
  write: write
  delete: delete
  action: write

# Explicit actions (matched case-insensitively; entries containing "*" are fnmatch globs).
actions:
  - {action: "Microsoft.Authorization/roleAssignments/write", maps: ["identity:grant"]}
  - {action: "Microsoft.Authorization/roleAssignments/delete", maps: ["identity:grant"]}
  - {action: "Microsoft.Authorization/roleAssignments/read", maps: ["identity:read"]}
  - {action: "Microsoft.Authorization/roleDefinitions/write", maps: ["identity:write"]}
  - {action: "Microsoft.Authorization/roleDefinitions/delete", maps: ["identity:delete"]}
  - {action: "Microsoft.Authorization/roleDefinitions/read", maps: ["identity:read"]}
  - {action: "Microsoft.Authorization/elevateAccess/Action", maps: ["identity:grant"]}
  - {action: "Microsoft.Authorization/policyAssignments/write", maps: ["security:admin"]}
  - {action: "Microsoft.Authorization/policyAssignments/delete", maps: ["security:admin"]}
  - {action: "Microsoft.Authorization/locks/write", maps: ["security:admin"]}
  - {action: "Microsoft.Authorization/locks/delete", maps: ["security:admin"]}
  - {action: "Microsoft.Authorization/*/read", maps: ["identity:read"]}
  - action: "Microsoft.Authorization/*"
    maps: ["identity:*"]
    expect: ["identity:admin", "identity:grant", "identity:impersonate"]
  - {action: "Microsoft.ManagedIdentity/userAssignedIdentities/assign/action", maps: ["identity:impersonate"]}
  - {action: "Microsoft.ManagedIdentity/userAssignedIdentities/*/assign/action", maps: ["identity:impersonate"]}
  - {action: "Microsoft.ManagedIdentity/userAssignedIdentities/write", maps: ["identity:write"]}
  - {action: "Microsoft.ManagedIdentity/userAssignedIdentities/delete", maps: ["identity:delete"]}
  - {action: "Microsoft.ManagedIdentity/userAssignedIdentities/read", maps: ["identity:read"]}
  - {action: "Microsoft.ManagedIdentity/userAssignedIdentities/federatedIdentityCredentials/write", maps: ["identity:grant"]}
  - action: "Microsoft.Storage/*"
    maps: ["storage:*"]
    expect: ["storage:read", "storage:write", "storage:delete", "storage:admin"]
  - {action: "Microsoft.Storage/storageAccounts/read", maps: ["storage:read"]}
  - {action: "Microsoft.Storage/storageAccounts/write", maps: ["storage:write"]}
  - {action: "Microsoft.Storage/storageAccounts/delete", maps: ["storage:delete"]}
  - {action: "Microsoft.Storage/storageAccounts/listKeys/action", maps: ["storage:admin"]}
  - {action: "Microsoft.Storage/storageAccounts/regenerateKey/action", maps: ["storage:admin"]}
  - {action: "Microsoft.Storage/storageAccounts/blobServices/containers/read", maps: ["storage:read"]}
  - {action: "Microsoft.Storage/storageAccounts/blobServices/containers/write", maps: ["storage:write"]}
  - {action: "Microsoft.Storage/storageAccounts/blobServices/containers/delete", maps: ["storage:delete"]}
  - {action: "Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read", maps: ["storage:read"]}
  - {action: "Microsoft.Storage/storageAccounts/blobServices/containers/blobs/write", maps: ["storage:write"]}
  - {action: "Microsoft.Storage/storageAccounts/blobServices/containers/blobs/delete", maps: ["storage:delete"]}
  - {action: "Microsoft.Storage/storageAccounts/blobServices/containers/blobs/manageOwnership/action", maps: ["storage:admin"]}
  - action: "Microsoft.Compute/*"
    maps: ["compute:*"]
    expect: ["compute:read", "compute:write", "compute:delete", "compute:admin"]
  - {action: "Microsoft.Compute/virtualMachines/read", maps: ["compute:read"]}
  - {action: "Microsoft.Compute/virtualMachines/write", maps: ["compute:write"]}
  - {action: "Microsoft.Compute/virtualMachines/delete", maps: ["compute:delete"]}
  - {action: "Microsoft.Compute/virtualMachines/start/action", maps: ["compute:write"]}
  - {action: "Microsoft.Compute/virtualMachines/restart/action", maps: ["compute:write"]}
  - {action: "Microsoft.Compute/virtualMachines/deallocate/action", maps: ["compute:write"]}
  - {action: "Microsoft.Compute/virtualMachines/runCommand/action", maps: ["compute:admin"]}
  - {action: "Microsoft.Compute/disks/read", maps: ["compute:read"]}
  - {action: "Microsoft.Compute/disks/write", maps: ["compute:write"]}
  - {action: "Microsoft.Compute/disks/delete", maps: ["compute:delete"]}
  - action: "Microsoft.Network/*"
    maps: ["network:*"]
    expect: ["network:read", "network:write", "network:delete", "network:admin"]
  - {action: "Microsoft.Network/virtualNetworks/read", maps: ["network:read"]}
  - {action: "Microsoft.Network/virtualNetworks/write", maps: ["network:write"]}
  - {action: "Microsoft.Network/virtualNetworks/delete", maps: ["network:delete"]}
  - {action: "Microsoft.Network/networkSecurityGroups/write", maps: ["network:write"]}
  - {action: "Microsoft.Network/networkSecurityGroups/securityRules/write", maps: ["network:write"]}
  - {action: "Microsoft.Network/networkInterfaces/join/action", maps: ["network:write"]}
  - action: "Microsoft.Sql/*"
    maps: ["data:*"]
    expect: ["data:read", "data:write", "data:delete", "data:admin"]
  - {action: "Microsoft.Sql/servers/databases/read", maps: ["data:read"]}
  - {action: "Microsoft.Sql/servers/databases/write", maps: ["data:write"]}
  - {action: "Microsoft.Sql/servers/databases/delete", maps: ["data:delete"]}
  - {action: "Microsoft.Sql/servers/databases/export/action", maps: ["data:read"]}
  - {action: "Microsoft.Sql/servers/databases/import/action", maps: ["data:write"]}
  - {action: "Microsoft.Sql/servers/firewallRules/write", maps: ["data:admin"]}
  - {action: "Microsoft.DocumentDB/databaseAccounts/listKeys/action", maps: ["data:admin"]}
  - action: "Microsoft.KeyVault/*"
    maps: ["security:*"]
    expect: ["security:read", "security:write", "security:delete", "security:admin"]
  - {action: "Microsoft.KeyVault/vaults/read", maps: ["security:read"]}
  - {action: "Microsoft.KeyVault/vaults/write", maps: ["security:write"]}
  - {action: "Microsoft.KeyVault/vaults/delete", maps: ["security:delete"]}
  - {action: "Microsoft.KeyVault/vaults/accessPolicies/write", maps: ["security:admin"]}
  - {action: "Microsoft.KeyVault/vaults/secrets/read", maps: ["security:read"]}
  - {action: "Microsoft.KeyVault/vaults/secrets/getSecret/action", maps: ["security:read"]}
  - {action: "Microsoft.KeyVault/vaults/secrets/setSecret/action", maps: ["security:write"]}
  - {action: "Microsoft.KeyVault/vaults/keys/read", maps: ["security:read"]}
  - {action: "Microsoft.KeyVault/vaults/keys/write", maps: ["security:write"]}
  - {action: "Microsoft.Security/*/read", maps: ["security:read"]}
  - {action: "Microsoft.Security/policies/write", maps: ["security:admin"]}
  - {action: "Microsoft.Insights/*/read", maps: ["security:read"]}
  - {action: "Microsoft.Insights/alertRules/write", maps: ["security:write"]}
  - {action: "Microsoft.Insights/diagnosticSettings/write", maps: ["security:write"]}
  - {action: "Microsoft.OperationalInsights/workspaces/query/read", maps: ["security:read"]}
  - {action: "Microsoft.OperationalInsights/workspaces/sharedKeys/action", maps: ["security:admin"]}
  - {action: "Microsoft.Billing/*/read", maps: ["billing:read"]}
  - {action: "Microsoft.Billing/billingAccounts/write", maps: ["billing:billing"]}
  - {action: "Microsoft.Billing/billingAccounts/billingProfiles/write", maps: ["billing:billing"]}
  - {action: "Microsoft.Billing/billingAccounts/paymentMethods/write", maps: ["billing:billing"]}
  - {action: "Microsoft.Consumption/*/read", maps: ["billing:read"]}
  - {action: "Microsoft.Consumption/budgets/write", maps: ["billing:billing"]}
  - {action: "Microsoft.CostManagement/*/read", maps: ["billing:read"]}
  - {action: "Microsoft.CostManagement/exports/write", maps: ["billing:billing"]}
  - {action: "Microsoft.Resources/subscriptions/resourceGroups/read", maps: ["compute:read"]}
  - {action: "Microsoft.Resources/subscriptions/resourceGroups/write", maps: ["compute:write"]}
  - {action: "Microsoft.Resources/subscriptions/resourceGroups/delete", maps: ["compute:delete"]}
  - {action: "Microsoft.Resources/deployments/write", maps: ["compute:write"]}
  - {action: "Microsoft.Support/*", maps: ["security:write"]}
  - action: "*/read"
    maps: ["*:read"]
    expect: ["compute:read", "storage:read", "network:read", "identity:read", "data:read",
             "security:read", "billing:read"]

