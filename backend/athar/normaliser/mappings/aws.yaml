# AWS managed policies (SPEC §5.3). Resource is "*" in every one of them → scope_level global.
# `admin` is reserved for unrestricted control; PowerUser-style policies get read/write/delete only
# (SPEC §7 R4: "individually acceptable roles ... PowerUser / Contributor / Editor").
managed_policies:
  - name: AdministratorAccess
    arn: arn:aws:iam::aws:policy/AdministratorAccess
    scope_level: global
    maps: ["*:admin", "identity:grant", "identity:impersonate"]
    expect: ["compute:admin", "storage:admin", "network:admin", "identity:admin", "data:admin",
             "security:admin", "billing:admin", "identity:grant", "identity:impersonate"]
  - name: PowerUserAccess
    arn: arn:aws:iam::aws:policy/PowerUserAccess
    scope_level: global
    maps: ["compute:read", "compute:write", "compute:delete",
           "storage:read", "storage:write", "storage:delete",
           "network:read", "network:write", "network:delete",
           "data:read", "data:write", "data:delete",
           "security:read", "security:write", "security:delete",
           "billing:read", "billing:billing",
           "identity:read", "identity:write"]
  - name: ReadOnlyAccess
    arn: arn:aws:iam::aws:policy/ReadOnlyAccess
    scope_level: global
    maps: ["*:read"]
    expect: ["compute:read", "storage:read", "network:read", "identity:read", "data:read",
             "security:read", "billing:read"]
  - name: ViewOnlyAccess
    arn: arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
    scope_level: global
    maps: ["*:read"]
    expect: ["compute:read", "storage:read", "network:read", "identity:read", "data:read",
             "security:read", "billing:read"]
  - name: SecurityAudit
    arn: arn:aws:iam::aws:policy/SecurityAudit
    scope_level: global
    maps: ["*:read"]
