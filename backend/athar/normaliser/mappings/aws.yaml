# ATHAR provider mapping — AWS (SPEC §5.3). The ONLY place AWS actions and managed policies
# are mapped to canonical (service_category, verb) pairs. Every entry is exercised by
# tests/unit/test_mappings_aws.py, which reads `expect` (or `maps` when it has no wildcard).
#
# `maps` entries are "category:verb"; "*" may stand for every category or for the category's
# wildcard verb set (mappings/canonical.yaml). An entry using "*" MUST carry an explicit `expect`.
version: 1
cloud: aws

# Scope levels (SPEC §5.2): first regex that matches the Resource string wins; default resource.
scope_levels:
  - {pattern: '^\*$', level: global}
  - {pattern: '^arn:[^:]*:organizations:', level: org}
  - {pattern: '^\d{12}$', level: project}
  - {pattern: '^arn:[^:]*:[^:]*:[^:]*:\d{12}:(root|\*)$', level: project}
  - {pattern: '^arn:', level: resource}

# Service namespace (the part before ":") → service_category.
services:
  s3: storage
  glacier: storage
  elasticfilesystem: storage
  backup: storage
  ec2: compute
  lambda: compute
  ecs: compute
  eks: compute
  autoscaling: compute
  elasticbeanstalk: compute
  batch: compute
  vpc: network
  elasticloadbalancing: network
  route53: network
  cloudfront: network
  apigateway: network
  directconnect: network
  iam: identity
  sts: identity
  organizations: identity
  sso: identity
  identitystore: identity
  cognito-idp: identity
  account: identity
  rds: data
  dynamodb: data
  redshift: data
  athena: data
  glue: data
  kinesis: data
  sqs: data
  sns: data
  kms: security
  secretsmanager: security
  ssm: security
  cloudtrail: security
  guardduty: security
  securityhub: security
  config: security
  inspector2: security
  wafv2: security
  acm: security
  access-analyzer: security
  cloudwatch: security
  logs: security
  aws-portal: billing
  billing: billing
  ce: billing
  cur: billing
  budgets: billing
  tax: billing
  payments: billing

# Unlisted action on a known service: leading verb word → canonical verb (case-insensitive).
verb_inference:
  Get: read
  List: read
  Describe: read
  Head: read
  Search: read
  Lookup: read
  Select: read
  Scan: read
  Query: read
  BatchGet: read
  Generate: read
  Simulate: read
  View: read
  Put: write
  Create: write
  Update: write
  Modify: write
  Set: write
  Add: write
  Associate: write
  Attach: write
  Enable: write
  Disable: write
  Start: write
  Stop: write
  Reboot: write
  Run: write
  Invoke: write
  Send: write
  Publish: write
  Restore: write
  Register: write
  Import: write
  Copy: write
  Tag: write
  Untag: write
  Upload: write
  Batch: write
  Delete: delete
  Remove: delete
  Terminate: delete
  Detach: delete
  Deregister: delete
  Deactivate: delete
  Cancel: delete
  Purge: delete

