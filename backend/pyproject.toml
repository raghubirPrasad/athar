[project]
name = "athar"
version = "0.1.0"
description = "ATHAR — multi-cloud access governance: normalise, score, explain, remediate, attest."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "typer>=0.12,<1",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "networkx>=3.3,<4",
  "pyyaml>=6.0,<7",
  "web3>=7.0,<8",
  "reportlab>=4.2,<5",
  "pyjwt>=2.9,<3",
  "argon2-cffi>=23.1,<24",
  "apscheduler>=3.10,<4",
  "google-genai>=1.0,<2",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
]

[project.scripts]
athar = "athar.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "hypothesis>=6.110,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0",
  "pandas-stubs>=2.2",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["athar"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["athar", "../tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "T20", "SIM", "RUF"]
ignore = ["S101", "S311", "RUF012", "B008", "S603", "S607", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"../tests/**" = ["S", "T20", "N802"]
"athar/db/migrations/**" = ["I", "N"]
"athar/cli.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["athar/db/migrations/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "integration: needs Postgres (DATABASE_URL) and/or Anvil (LEDGER_RPC_URL)",
  "slow: long-running",
]
